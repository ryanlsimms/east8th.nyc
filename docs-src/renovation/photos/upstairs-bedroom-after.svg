<svg xmlns="http://www.w3.org/2000/svg" viewBox="350 405 790 1130" role="img" aria-labelledby="title desc">
<title id="title">After: upstairs bedroom renovation</title>
<desc id="desc">First-floor plan traced from the supplied screenshot. Bedroom is 8 feet 2 inches wide and 13 feet 8 inches long after removal of the laundry room and closet. Screenshot ends before the rest of the floor. Diagram only, not for construction.</desc>
<style>
:root{--paper:#fffdf7;--ink:#14251f;--muted:#5d6a63;--accent:#245743;--soft:#dfeadf;--line:#e2d6c2}
@media(prefers-color-scheme:dark){:root{--paper:#0d2530;--ink:#f1ead9;--muted:#a9b7b4;--accent:#d9ff5b;--soft:#23402a;--line:#1f3d4a}}
svg{background:var(--paper);font-family:'DM Sans',system-ui,sans-serif}
.wall{fill:none;stroke:var(--ink);stroke-width:13;stroke-linejoin:miter}
.fixture{fill:none;stroke:var(--muted);stroke-width:2}
.door{fill:none;stroke:var(--muted);stroke-width:2}
.gap{stroke:var(--paper);stroke-width:17}
.glass{stroke:var(--accent);stroke-width:4}
text{fill:var(--ink);text-anchor:middle;font-size:20px}
.label{font-weight:700} .small{fill:var(--muted);font-size:16px}
.dim{fill:none;stroke:var(--muted);stroke-width:1.5}
</style>
